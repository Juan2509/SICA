name: sica

services:
  postgres:
    image: postgres:17-alpine
    container_name: sica-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sica_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sica_postgres_local}
      SICA_APP_PASSWORD: ${SICA_APP_PASSWORD:-sica_app_local}
      TZ: America/Bogota
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sica_postgres_data:/var/lib/postgresql/data
      - ./sica/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sica/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
      - ./docker/init/03-security.sh:/docker-entrypoint-initdb.d/03-security.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sica_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: sica-app:local
    container_name: sica-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SICA_DB_URL: jdbc:postgresql://postgres:5432/sica_db
      SICA_DB_USER: sica_app
      SICA_DB_PASSWORD: ${SICA_APP_PASSWORD:-sica_app_local}
      DISPLAY: :99
      JAVA_TOOL_OPTIONS: -Dprism.order=sw -Djava.awt.headless=false
    ports:
      - "127.0.0.1:6080:6080"

volumes:
  sica_postgres_data:
    name: sica_postgres_data
